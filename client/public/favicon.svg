<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C518" />
      <stop offset="100%" stop-color="#C9A84C" />
    </linearGradient>
  </defs>
  
  <!-- Stem -->
  <path d="M 50,85 Q 45,65 50,50" fill="none" stroke="#2B3A2C" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Leaf -->
  <path d="M 50,50 C 35,35 45,15 60,15 C 75,15 75,30 50,50 Z" fill="none" stroke="#2B3A2C" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner Gold Vein -->
  <path d="M 50,50 Q 55,30 60,15" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Infinity Symbol -->
  <path d="M 30,65 C 5,65 5,35 30,35 C 45,35 55,65 70,65 C 95,65 95,35 70,35 C 55,35 45,65 30,65 Z" 
        fill="none" stroke="#2B3A2C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Infinity Inner Gold Accent -->
  <path d="M 30,61 C 12,61 12,39 30,39 C 42,39 52,58 70,58 C 88,58 88,42 70,42" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>